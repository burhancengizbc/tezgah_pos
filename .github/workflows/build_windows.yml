name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter 3.44.1
        shell: pwsh
        run: |
          git clone https://github.com/flutter/flutter.git C:\flutter
          cd C:\flutter
          git checkout 3.44.1
          echo "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Flutter Info
        shell: pwsh
        run: |
          flutter --version
          dart --version

      - name: Enable Windows
        run: flutter config --enable-windows-desktop

      - name: Clean
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Build
        run: flutter build windows --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tezgah_pos_windows
          path: build/windows/x64/runner/Release