name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Flutter SDK Kur
        shell: pwsh
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 C:\flutter

          echo "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $env:PATH="C:\flutter\bin;$env:PATH"

          where.exe flutter
          flutter --version
          dart --version

      - name: Flutter Yapılandır
        shell: pwsh
        run: |
          $env:PATH="C:\flutter\bin;$env:PATH"
          flutter config --enable-windows-desktop

      - name: Pub Get
        shell: pwsh
        run: |
          $env:PATH="C:\flutter\bin;$env:PATH"
          flutter pub get

      - name: Windows Build
        shell: pwsh
        run: |
          $env:PATH="C:\flutter\bin;$env:PATH"
          flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: tezgah_pos_windows
          path: build/windows/x64/runner/Release