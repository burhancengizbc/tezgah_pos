name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Flutter SDK Temiz Kurulumu
        shell: pwsh
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 C:\flutter
          echo "C:\flutter\bin" >> $env:GITHUB_PATH

      - name: Flutter Yapilandirmasi
        run: |
          flutter --version
          flutter config --enable-windows-desktop

      - name: Bagimliliklari Yukle
        run: flutter pub get

      - name: Windows EXE Derle
        run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: tezgah_pos_windows
          path: build/windows/x64/runner/Release