name: tezgah_pos
description: "Tezgah POS - Offline-first yerel adisyon ve isletme yonetim sistemi."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.2

  # Yerel veritabani (offline-first) - Sürümlerin uyumlu olduğundan emin olundu
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2

  # Dosya / yol / paylasim
  path_provider: ^2.1.3
  path: ^1.9.0
  file_picker: ^12.0.0-beta.7
  share_plus: ^13.3.0

  # Yedekleme (JSON + ZIP)
  archive: ^4.0.9

  # Guvenlik (PIN hash)
  crypto: ^3.0.3

  # Bicimlendirme (para / tarih - tr_TR)
  intl: ^0.20.3

  # PDF rapor olusturma + onizleme/paylasim/yazdirma
  pdf: ^3.12.0
  printing: ^5.13.1

  # ESC/POS termal fis
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.2.2

  # Geolocator ve Geocoding (Sürüm çakışması önlendi: ^12.0.0)
  geolocator: ^14.0.3
  geocoding: ^5.0.0

  # Caller ID ve İzinler
  phone_state: ^3.0.1
  permission_handler: ^13.0.0

  # Yerel ag (LAN) ve Sunucu
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3
  network_info_plus: ^5.0.3
  http: ^1.2.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  isar_community_generator: ^3.3.2

flutter:
  uses-material-design: true